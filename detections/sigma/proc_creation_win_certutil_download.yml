title: Suspicious Certutil Download / Decode
id: 3b3ce9f8-4a5f-4f77-9d33-8c0f6a3f0a11
status: stable
description: >
  Detects certutil.exe being used to download a file from a URL or to
  decode a base64/encoded payload — a common living-off-the-land ingress
  and defense-evasion pattern.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
level: high
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\certutil.exe'
  selection_flags:
    CommandLine|contains:
      - '-urlcache'
      - '/urlcache'
      - '-decode'
      - '/decode'
      - '-verifyctl'
  condition: all of selection_*
falsepositives:
  - Legitimate certificate maintenance scripts
tags:
  - attack.command_and_control
  - attack.t1105
  - attack.defense_evasion
  - attack.t1140
