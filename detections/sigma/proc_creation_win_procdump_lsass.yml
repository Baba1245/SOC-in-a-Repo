title: LSASS Memory Dump via Procdump
id: 2c3d4e5f-6071-8293-a4b5-c6d7e8f90107
status: stable
description: Detects procdump targeting lsass.exe to steal credentials.
references:
  - https://attack.mitre.org/techniques/T1003/001/
level: critical
logsource:
  product: windows
  category: process_creation
detection:
  selection_tool:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
  selection_target:
    CommandLine|contains: 'lsass'
  condition: all of selection_*
falsepositives:
  - Sanctioned DFIR memory acquisition
tags:
  - attack.credential_access
  - attack.t1003.001
