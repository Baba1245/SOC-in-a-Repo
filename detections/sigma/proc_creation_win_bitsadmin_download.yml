title: Bitsadmin Download
id: 3d4e5f60-7182-93a4-b5c6-d7e8f9001208
status: stable
description: Detects bitsadmin.exe used to transfer a remote file.
references:
  - https://attack.mitre.org/techniques/T1197/
level: medium
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\bitsadmin.exe'
    CommandLine|contains:
      - '/transfer'
      - '/addfile'
  condition: selection
falsepositives:
  - Some software updaters
tags:
  - attack.defense_evasion
  - attack.persistence
  - attack.t1197
