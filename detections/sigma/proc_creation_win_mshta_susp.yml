title: Suspicious Mshta Execution
id: 6b6f7f2a-1d0a-4c8b-8b2c-2b5b4f1d9a02
status: stable
description: Detects mshta.exe executing inline script or remote content.
references:
  - https://attack.mitre.org/techniques/T1218/005/
level: high
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
      - 'http://'
      - 'https://'
      - '.hta'
  condition: selection
falsepositives:
  - Legacy internal HTA applications
tags:
  - attack.defense_evasion
  - attack.t1218.005
